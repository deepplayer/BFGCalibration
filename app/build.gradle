plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def releaseSigningFile = rootProject.file("release-signing.properties")
def releaseSigningProperties = new Properties()
def releaseSigningReady = releaseSigningFile.exists()
if (releaseSigningReady) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
    def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingKeys = requiredKeys.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingKeys.isEmpty()) {
        throw new GradleException("release-signing.properties 缺少字段: ${missingKeys.join(', ')}")
    }
}

android {

    namespace 'com.onebitmonochrome.blacksbbox'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "com.bfgtools.calibration.imported"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseSigningProperties.getProperty("storeFile"))
                storePassword releaseSigningProperties.getProperty("storePassword")
                keyAlias releaseSigningProperties.getProperty("keyAlias")
                keyPassword releaseSigningProperties.getProperty("keyPassword")
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir("generated/blackboxGalleryAssets"))
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "BFGCalibration_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                    "正式版缺少 release-signing.properties 和固定发布密钥；禁止使用调试证书发布。")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "packageRelease" || task.name == "bundleRelease") {
        task.dependsOn("verifyReleaseSigning")
    }
}

def blackBoxGalleryAssetsDir = layout.buildDirectory.dir("generated/blackboxGalleryAssets")

tasks.register("copyBlackBoxGuestGalleryApk", Copy) {
    dependsOn(":blackbox-gallery-stub:assembleDebug")
    from("$rootDir/blackbox-gallery-stub/build/outputs/apk/debug") {
        include("*.apk")
        rename { "blackbox-gallery-stub.apk" }
    }
    into(blackBoxGalleryAssetsDir)
}

tasks.named("preBuild").configure {
    dependsOn("copyBlackBoxGuestGalleryApk")
}

