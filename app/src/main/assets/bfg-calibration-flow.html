    'info':'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-8h.01"/>',
    'power':'<path d="M12 2v10m6.4-6.4a9 9 0 1 1-12.8 0"/>',
    'package-plus':'<path d="m12 2 9 5-9 5-9-5 9-5zM3 7v10l9 5 9-5V7M12 12v10m5-8h6m-3-3v6"/>',
    'package-open':'<path d="M3 8 12 3l9 5-9 5zM3 8v9l9 5 9-5V8M12 13v9"/>',
    'log-in':'<path d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>',
    'sliders-horizontal':'<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    'rotate-ccw':'<path d="M3 11a9 9 0 1 0 3-6.7L3 7m0-5v5h5"/>'
  };
  document.querySelectorAll('i[data-lucide]').forEach(node => {
    const name = node.getAttribute('data-lucide');
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none');
    svg.setAttribute('width','18'); svg.setAttribute('height','18');
    svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','1.8');
    svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
    svg.setAttribute('aria-hidden','true'); svg.innerHTML = paths[name] || paths.info;
    node.replaceWith(svg);
  });
}};
</script>
<script>
(() => {

    vehicleSn: '', vehicleModel: '', vehicles: [], connected: false,

    dashboardVoltage: '--', dashboardCapacity: '--',
    meterVoltage: '--', meterCapacity: '--', dashboardFirmware: '--',
    colorDisplayFirmware: '--', centreFirmware: '--', meterFirmware: '--',
    busyMessage: '', errorMessage: '', writeSupported: false,
    pairScanning: false, pairScanSeconds: 0, writeStage: 'precheck',
    firstBackup: '尚未建立', recentBackup: '尚未写入',
    lastConfirmedTarget: '尚无已确认的写入', firstBackupValid: false,
    recentBackupValid: false, backupAlternativesDiffer: false,
    scanModule: '', scanReplies: 0, scanTimeouts: 0,
    dashboardWriteSupported: false, availableCapacities: [], capacityByVoltage: {},
    readOnlyVehicle: false,
    rootFallback: true, appVersion: '', selectedVehicleIndex: 0,
    result: initial.result === 'failure' ? 'failure' : initial.result === 'success' ? 'success' : null,
    modal: null,
    radius: 22,
    accent: '#2f7cf6',
    compact: false
  };

  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let maskedSn = '尚未选择车辆';
  const visibleSn = () => state.connected ? maskedSn : (state.vehicleSn || '尚未选择车辆');
  const nativeAction = (action, value = '') => { if (window.BfgNative) window.BfgNative.action(action, String(value)); };
  let lastModalVisibility = null;

  function save() { /* State is supplied by the Android bridge. */ }

  function header(title, subtitle, back) {
    return `<header class="nb-header">
      ${back ? `<button class="nb-icon-btn" type="button" data-action="back" aria-label="返回">${icon('chevron-left')}</button>` : ''}
      <div class="nb-header-copy"><h2 class="nb-title">${title}</h2><p class="nb-subtitle">${subtitle}</p></div>
      ${!back ? `<button class="nb-icon-btn nb-settings-btn" type="button" data-action="settings" aria-label="设置">${icon('sliders-horizontal')}<span>设置</span></button>` : ''}
    </header>`;
  }

  function bottomNav(active = 'home') {
    return `<nav class="nb-bottom-nav" aria-label="底部导航">
      <button type="button" class="${active === 'home' ? 'is-active' : ''}" data-action="home">${icon('house')}<span>首页</span></button>
      <button type="button" class="${active === 'vehicle' ? 'is-active' : ''}" data-action="vehicles">${icon('bike')}<span>车辆</span></button>
      <button type="button" class="${active === 'settings' ? 'is-active' : ''}" data-action="settings">${icon('sliders-horizontal')}<span>设置</span></button>
    </nav>`;
  }

  function homeTemplate() {
    return `<div class="nb-page">
      ${header('BFG 电量校准', '连接、核对，再进行参数写入', false)}
      <main class="nb-content">
        <section class="nb-card nb-vehicle-card">
          <div class="nb-vehicle-icon">${icon('bike')}</div>
          <div class="nb-grow"><div class="nb-label">当前车辆</div><div class="nb-value">${esc(visibleSn())}</div><div class="nb-label">${esc(state.vehicleModel || '核对序列号确认车型再连接')}</div></div>
          <span class="nb-badge">${icon('shield-check')}${state.connected ? '已连接' : '待连接'}</span>
        </section>
        <section class="nb-card nb-section">
          <div class="nb-vehicle-card" style="padding:0;border:0;background:transparent">
            <div class="nb-vehicle-icon">${icon('smartphone')}</div>
            <div class="nb-grow"><div class="nb-label">${state.rootMode ? '本机九号数据' : '九号出行'}</div><div class="nb-value">${state.rootMode ? 'Root 模式' : state.officialImported ? '安装包已导入' : '尚未导入'}</div><div class="nb-label">${state.vehicles.length ? `已找到 ${state.vehicles.length} 台车辆` : state.rootMode ? '点击下方按钮读取本机数据' : '登录账号后可读取车辆凭据'}</div></div>
            <span class="nb-badge">${icon(state.rootMode || state.officialImported ? 'circle-check' : 'package-open')}${state.rootMode ? '本机读取' : state.officialImported ? '可登录' : '未导入'}</span>
          </div>
          <div class="nb-inline-actions">
            <button class="nb-secondary" type="button" data-action="open-import">导入九号出行 APK</button>
            <button class="nb-primary" type="button" data-action="${state.rootMode ? 'refresh-root' : 'open-login'}">${state.rootMode ? '读取本机车辆' : '登录九号出行'}</button>
          </div>
        </section>
        <section class="nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">开始使用</h3><p class="nb-section-note">请选择一种连接方式</p></div>

        </section>
      </main>
      ${bottomNav('home')}
    </div>`;
  }

  function vehicleListTemplate() {
    return `<div class="nb-page">
      ${header('选择车辆', '核对序列号后再继续', true)}

        <div class="nb-alert warning">${icon('shield-alert')}<span>仅配对本人拥有或已获授权的车辆。</span></div>
        ${state.pairScanning ? `<div class="nb-card nb-section" role="status" aria-live="polite" style="display:flex;align-items:center;gap:14px"><div class="nb-progress-ring" style="width:28px;height:28px;flex:0 0 28px;border-width:3px;margin:0" aria-label="正在扫描"></div><div><div class="nb-value">正在搜索附近车辆</div><div class="nb-label">约 ${state.pairScanSeconds} 秒后结束 · 已找到 ${state.vehicles.length} 台</div></div></div>` : ''}
        ${state.errorMessage ? `<div class="nb-alert danger nb-section">${icon('circle-x')}<span>${esc(state.errorMessage)}</span></div>` : ''}
        <section class="nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">附近车辆</h3><p class="nb-section-note">已找到 ${state.vehicles.length} 台</p></div>
          <div class="nb-list">
            ${state.vehicles.map((vehicle, index) => `<button type="button" class="nb-list-item" data-action="pair-select" data-index="${index}"><div class="nb-vehicle-icon">${icon('bike')}</div><div class="nb-grow"><div class="nb-value">${esc(vehicle.sn)}</div><div class="nb-label">${esc(vehicle.detail || '请确认是自己的车辆')}</div></div>${icon('chevron-right')}</button>`).join('')}
          </div>
        </section>
        <button class="nb-secondary" type="button" data-action="pair-list">重新扫描</button>
      </main>
      ${bottomNav('vehicle')}
    </div>`;
  }

  function vehiclesTemplate() {
    return `<div class="nb-page">
      ${header('车辆管理', '核对完整序列号后再连接', true)}
      <main class="nb-content">
        <div class="nb-section-head"><h3 class="nb-section-title">我的车辆</h3><p class="nb-section-note">${state.vehicles.length} 台</p></div>
        <div class="nb-list">
          ${state.vehicles.length ? state.vehicles.map((vehicle, index) => `<button type="button" class="nb-list-item" data-action="select-vehicle" data-index="${index}"><div class="nb-vehicle-icon">${icon('bike')}</div><div class="nb-grow"><div class="nb-value">${esc(vehicle.sn)}</div><div class="nb-label">${esc(vehicle.detail || '核对序列号确认车型再连接')}</div></div>${index === state.selectedVehicleIndex ? `<span class="nb-badge">当前</span>` : icon('chevron-right')}</button>`).join('') : `<div class="nb-card"><div class="nb-value">尚未找到车辆</div><div class="nb-label">可返回首页导入九号出行，或在设置中启用 Root 模式。</div></div>`}
        </div>
        <section class="nb-section"><button class="nb-secondary" type="button" data-action="refresh-vehicles">重新读取车辆</button></section>
      </main>
      ${bottomNav('vehicle')}
    </div>`;
  }

  function settingsTemplate() {
    return `<div class="nb-page">
      ${header('设置', '数据来源与软件说明', true)}
      <main class="nb-content">
        <section>
          <div class="nb-section-head"><h3 class="nb-section-title">数据读取方式</h3></div>
          <div class="nb-mode-list">
            <button class="nb-mode ${!state.rootMode ? 'is-selected' : ''}" type="button" data-action="set-root" data-value="false"><span class="nb-mode-dot"></span><span class="nb-grow"><span class="nb-mode-title">导入九号出行 APK</span><span class="nb-mode-desc">在工具独立环境登录后读取车辆数据。</span></span></button>
            <button class="nb-mode ${state.rootMode ? 'is-selected' : ''}" type="button" data-action="set-root" data-value="true"><span class="nb-mode-dot"></span><span class="nb-grow"><span class="nb-mode-title">Root 读取本机</span><span class="nb-mode-desc">直接读取原机九号出行数据，无需导入。</span></span></button>
          </div>
        </section>
        <section class="nb-card nb-section">
          <div class="nb-info-list"><div class="nb-info-row"><span>已导入安装包</span><strong>${state.officialImported ? '已导入' : '尚未导入'}</strong></div><div class="nb-info-row"><span>读取失败自动回退</span><strong>${state.rootFallback ? '开启' : '关闭'}</strong></div></div>
          <div class="nb-inline-actions"><button class="nb-secondary" type="button" data-action="open-import">导入 APK</button><button class="nb-secondary" type="button" data-action="import-root">从本机导入</button></div>
          <button class="nb-secondary" style="margin-top:10px" type="button" data-action="toggle-fallback">${state.rootFallback ? '关闭' : '开启'}自动回退</button>
        </section>
        <section class="nb-card nb-section"><div class="nb-section-head"><h3 class="nb-section-title">参数备份与恢复</h3></div>
          <div class="nb-label">当前车辆</div><div class="nb-value" style="overflow-wrap:anywhere">${esc(maskedSn)}</div>
          <div class="nb-label" style="margin-top:12px">首次原参数</div><div class="nb-value" style="overflow-wrap:anywhere">${esc(state.firstBackup)}</div>
          <div class="nb-label" style="margin-top:12px">最近一次写入前参数</div><div class="nb-value" style="overflow-wrap:anywhere">${esc(state.recentBackup)}</div>

  function readyTemplate(pairing) {
    const title = pairing ? '准备配对' : '准备连接';
    const desc = pairing ? '需要在车上按键确认' : '使用已有凭据进行认证';
    return `<div class="nb-page">
      ${header(title, desc, true)}
      <main class="nb-content">
        ${state.errorMessage && !state.modal ? `<div class="nb-alert danger">${icon('circle-x')}<span>${esc(state.errorMessage)}</span></div>` : ''}

    </div>`;
  }

  function progressTemplate(pairing) {
    return `<div class="nb-page">
      ${header(pairing ? '正在配对' : '正在连接', esc(state.vehicleSn), true)}
      <main class="nb-content nb-center">
        <div class="nb-progress-ring" role="progressbar" aria-label="${pairing ? '配对中' : '连接中'}"></div>

        <div class="nb-card nb-section"><div class="nb-info-list"><div class="nb-info-row"><span>车辆</span><strong>${esc(state.vehicleSn)}</strong></div><div class="nb-info-row"><span>当前步骤</span><strong>${pairing ? '等待车端确认' : '安全认证'}</strong></div></div></div>
      </main>
    </div>`;
  }

  function writeProgressTemplate() {
    const dash = state.writeType === 'dashboard';
    const precheck = state.writeStage !== 'writing';
    return `<div class="nb-page">
      ${header(precheck ? '正在核对并备份' : '正在写入并回读', `${esc(maskedSn)} · ${state.voltage}V${dash ? '' : ` / ${state.capacity}Ah`}`, true)}
      <main class="nb-content nb-center">
        <div class="nb-progress-ring" role="progressbar" aria-label="${precheck ? '核对并备份中' : '写入并回读中'}"></div>
        <h2 class="nb-title">请保持车辆开启</h2>
        <p>先重新读取并备份原参数，备份成功后才会写入${dash ? '仪表盘电压配置' : '计量模块电压与容量配置'}。</p>
        <div class="nb-card nb-section"><div class="nb-info-list"><div class="nb-info-row"><span>写入位置</span><strong>${dash ? '仪表盘' : '计量模块'}</strong></div><div class="nb-info-row"><span>目标电压</span><strong>${state.voltage}V</strong></div>${dash ? '' : `<div class="nb-info-row"><span>目标容量</span><strong>${state.capacity}Ah</strong></div>`}<div class="nb-info-row"><span>当前步骤</span><strong>${esc(state.busyMessage || '等待安全回读')}</strong></div></div></div>
      </main>
    </div>`;

  function postWriteCheckTemplate() {
    return `<div class="nb-page">
      ${header('正在核对写入结果', esc(maskedSn), true)}
      <main class="nb-content nb-center">
        <div class="nb-progress-ring" role="progressbar" aria-label="二次核对中"></div>

  function scanTemplate() {
    const progress = state.screen === 'scan-progress';
    return `<div class="nb-page">
      ${header(progress ? '正在只读扫描' : '扫描结果', esc(state.scanModule || '车辆寄存器'), true)}

        <p>${progress ? '仅发送读取命令。请保持车辆开机并靠近手机，随时可以取消。' : (state.errorMessage ? esc(state.errorMessage) : `收到 ${state.scanReplies} 个寄存器响应，${state.scanTimeouts} 个地址未回复。请在开始下一次扫描前导出本次日志。`)}</p>

  function reviewTemplate() {
    const resultBanner = state.modal ? '' : state.result === 'success'
      ? `<div class="nb-alert success">${icon('circle-check')}<span><strong>写入并回读成功</strong><br>${state.writeType === 'dashboard' ? '仪表盘电压配置已回读。断电后是否保持，请重启车辆再确认。' : '计量模块电压与容量已更新，车辆断电重启后可能恢复。'}</span></div>`
      : state.result === 'failure'
      ? `<div class="nb-alert danger">${icon('circle-x')}<span><strong>本次写入未确认</strong><br>${esc(state.errorMessage || '请重新连接读取当前数据，再决定是否重试。')}</span></div>`
      : '';
    return `<div class="nb-page">
      ${header('核对车辆信息', '确认数据无误后再写入', true)}
      <main class="nb-content">
        ${resultBanner}
        <section class="nb-card ${resultBanner ? 'nb-section' : ''}">
          <div class="nb-vehicle-card" style="padding:0;border:0;background:transparent">
            <div class="nb-vehicle-icon">${icon('bike')}</div><div class="nb-grow"><div class="nb-value">${esc(maskedSn)}</div><div class="nb-label">${esc(state.vehicleModel)} · 蓝牙已连接</div></div><span class="nb-badge">${icon('bluetooth')}已连接</span>
          </div>
          <div class="nb-grid-3 nb-section">
            <div class="nb-metric"><div class="nb-label">当前电量</div><div class="nb-value">${esc(state.soc)}%</div></div>
            <div class="nb-metric"><div class="nb-label">电池电压</div><div class="nb-value">${esc(state.batteryVoltage)}</div></div>
            <div class="nb-metric"><div class="nb-label">剩余容量</div><div class="nb-value">${esc(state.remainingCapacity)}</div></div>
          </div>
        </section>
        <section class="nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">校准配置</h3><p class="nb-section-note">当前读取结果</p></div>
          <div class="nb-card nb-compare">
            <div class="nb-compare-col"><div class="nb-label">仪表盘</div><div class="nb-compare-row"><span>校准电压</span><strong>${esc(state.dashboardVoltage)}</strong></div><div class="nb-compare-row"><span>校准容量</span><strong>${esc(state.dashboardCapacity)}</strong></div></div>
            <div class="nb-compare-col"><div class="nb-label">计量模块</div><div class="nb-compare-row"><span>校准电压</span><strong>${esc(state.meterVoltage)}</strong></div><div class="nb-compare-row"><span>校准容量</span><strong>${esc(state.meterCapacity)}</strong></div></div>
          </div>
        </section>
        <section class="nb-card nb-section"><div class="nb-info-list"><div class="nb-info-row"><span>仪表控制器</span><strong>${esc(state.dashboardFirmware)}</strong></div><div class="nb-info-row"><span>彩屏仪表</span><strong>${esc(state.colorDisplayFirmware)}</strong></div><div class="nb-info-row"><span>中控</span><strong>${esc(state.centreFirmware)}</strong></div><div class="nb-info-row"><span>计量模块</span><strong>${esc(state.meterFirmware)}</strong></div></div></section>
        <div class="nb-alert warning nb-section">${icon('triangle-alert')}<span>本页读取结果仅供参考，请核对车辆实际配置；不能仅凭本页数据判断电池或车辆状态。</span></div>
        <section class="nb-section">
          <button class="nb-primary" type="button" data-action="write">${state.result ? '再次写入' : '进入参数写入'}</button>
          <button class="nb-secondary" style="margin-top:10px" type="button" data-action="refresh-review">重新读取当前数据</button>
        </section>
      </main>
      ${bottomNav('vehicle')}
    </div>`;
  }

  function writeTemplate() {
    const isDash = state.writeType === 'dashboard';
    const writeBlocked = isDash ? !state.dashboardWriteSupported : !state.writeSupported;
    const blockedReason = state.readOnlyVehicle
      ? '此车仅支持读取，不会发送写入指令。'
      : isDash
      ? '仪表盘写入暂不可用。请查看版本要求与当前读取结果。'
      : '计量模块写入条件未确认，请重新读取车辆信息。';
    return `<div class="nb-page">
      ${header('参数写入', `${esc(maskedSn)} · 当前 ${esc(state.meterVoltage)} / ${esc(state.meterCapacity)}`, true)}
      <main class="nb-content">
        <section>
          <div class="nb-section-head"><h3 class="nb-section-title">选择写入位置</h3><p class="nb-section-note">作用范围不同</p></div>
          <div class="nb-mode-list">
            <button class="nb-mode ${isDash ? 'is-selected' : ''}" type="button" data-type="dashboard"><span class="nb-mode-dot"></span><span class="nb-grow"><span class="nb-mode-title">仪表盘电压写入 <span class="nb-lifetime">持久配置·高风险</span></span><span class="nb-mode-desc">只写入仪表盘电压配置；容量写入地址尚未确认。</span></span></button>
            <button class="nb-mode ${!isDash ? 'is-selected' : ''}" type="button" data-type="meter"><span class="nb-mode-dot"></span><span class="nb-grow"><span class="nb-mode-title">计量模块参数写入 <span class="nb-temporary">临时生效</span></span><span class="nb-mode-desc">写入电压与容量，断电重启后可能恢复原值。</span></span></button>
          </div>
        </section>
        <section class="nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">选择目标电压</h3><p class="nb-section-note">48V / 60V / 72V</p></div>
          <div class="nb-voltages">
            ${[48,60,72].map(v => `<button class="nb-voltage ${state.voltage === v ? 'is-selected' : ''}" type="button" data-voltage="${v}">${v}V</button>`).join('')}
          </div>
        </section>
        <section class="nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">选择目标容量</h3><p class="nb-section-note">${isDash ? '仪表盘容量暂不可写' : '从小到大排列'}</p></div>
          <div class="nb-capacities">
            ${state.availableCapacities.map(v => `<button class="nb-capacity ${state.capacity === v ? 'is-selected' : ''}" type="button" data-capacity="${v}" ${isDash ? 'disabled' : ''}>${v}Ah</button>`).join('')}
          </div>
        </section>
        <section class="nb-card nb-section nb-summary"><div><div class="nb-label">即将写入</div><strong>${isDash ? esc(state.dashboardVoltage) : `${esc(state.meterVoltage)} · ${esc(state.meterCapacity)}`} → ${state.voltage}V${isDash ? '' : ` · ${state.capacity}Ah`}</strong></div><span class="nb-chevron">${icon('arrow-right')}</span></section>
        <div class="nb-alert ${isDash ? 'warning' : 'success'} nb-section">${icon(isDash ? 'triangle-alert' : 'rotate-ccw')}<span>${isDash ? '仪表盘配置可能在断电后持续生效，已有计量模块损坏案例。写入前会再次显示完整风险说明。' : '计量模块电压与容量写入后会回读，车辆断电重启后可能恢复原配置。'}</span></div>
        ${writeBlocked ? `<div class="nb-alert danger nb-section">${icon('circle-x')}<span>${blockedReason}</span></div>` : ''}
        ${writeBlocked && isDash && !state.readOnlyVehicle ? '<button class="nb-secondary" type="button" data-action="show-dashboard-requirements">查看不支持原因</button>' : ''}
        <section class="nb-section"><button class="nb-primary" type="button" data-action="confirm-write" ${writeBlocked ? 'disabled' : ''}>${writeBlocked ? '当前不可写入' : '核对并写入'}</button></section>
      </main>
    </div>`;
  }

  function writeConfirmModal() {
    const dash = state.writeType === 'dashboard';
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="写入前确认"><div class="nb-modal">
      <div class="nb-modal-icon">${icon(dash ? 'shield-alert' : 'timer-reset')}</div>
      <h3>确认写入 ${state.voltage}V${dash ? '' : ` · ${state.capacity}Ah`}？</h3>
      <p>${dash ? '先重新读取并自动备份原参数，再阅读 30 秒高风险说明并二次确认。备份不保证能够恢复。' : '先重新读取并自动备份原参数，再阅读 3 秒临时写入风险提醒。断电重启后参数可能恢复。'}</p>
      <div class="nb-card"><div class="nb-info-list"><div class="nb-info-row"><span>车辆</span><strong>${esc(maskedSn)}</strong></div><div class="nb-info-row"><span>写入位置</span><strong>${dash ? '仪表盘' : '计量模块'}</strong></div><div class="nb-info-row"><span>参数变化</span><strong>${dash ? esc(state.dashboardVoltage) : `${esc(state.meterVoltage)} · ${esc(state.meterCapacity)}`} → ${state.voltage}V${dash ? '' : ` · ${state.capacity}Ah`}</strong></div></div></div>
      <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">取消</button><button type="button" class="nb-primary" data-action="do-write">确认写入</button></div>
    </div></div>`;
  }

  function dashboardRequirementsModal() {
    const versions = [
      ['仪表控制器', '2.5.9', state.dashboardFirmware],
      ['彩屏仪表', '1.5.5', state.colorDisplayFirmware],
      ['中控', '5.12.10', state.centreFirmware],
      ['计量模块', '4.2.9', state.meterFirmware]
    ];
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="仪表盘写入条件"><div class="nb-modal">
      <div class="nb-modal-icon">${icon('shield-alert')}</div>
      <h3>当前不可写入仪表盘</h3>
      <p>四项固件须全部匹配，且仪表电压配置须读取成功。不满足时工具不会发送仪表盘写入命令。</p>
      <div class="nb-fw-list">${versions.map(([name, expected, actual]) => `<div class="nb-fw-row"><span>${name}</span><strong>需 ${expected}</strong><em class="${actual === expected ? 'is-match' : ''}">当前 ${esc(actual)}</em></div>`).join('')}</div>
      <p style="margin-top:12px">仪表当前电压：${esc(state.dashboardVoltage)}。计量模块临时写入有独立的读取与风险确认条件。</p>
      <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">返回</button><button type="button" class="nb-primary" data-action="refresh-review">重新读取</button></div>
    </div></div>`;
  }

  function wakeModal() {
    const pairing = state.path === 'pair';
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="车辆开机确认"><div class="nb-modal">
      <div class="nb-modal-icon">${icon('power')}</div>
      <h3>请先将车辆开机</h3>
      <p>保持车辆在手机附近，并关闭其他正在连接车辆的应用或手机。</p>
      <div class="nb-card"><div class="nb-info-list"><div class="nb-info-row"><span>车辆</span><strong>${esc(state.vehicleSn)}</strong></div><div class="nb-info-row"><span>下一步</span><strong>${pairing ? '发起配对' : '发起连接'}</strong></div></div></div>
      <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">取消</button><button type="button" class="nb-primary" data-action="wake-confirm">车辆已开机</button></div>
    </div></div>`;
  }

  function officialAppModal() {
    if (state.modal === 'missing-vehicle') {
      return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="未找到车辆"><div class="nb-modal">
        <div class="nb-modal-icon">${icon('bike')}</div>
        <h3>还没有可连接的车辆</h3>
        <p>${state.rootMode ? '请先读取本机九号数据，或选择临时密钥配对。' : '可以先导入九号出行 APK 并用账号密码登录，也可以直接在车上确认临时密钥配对。'}</p>
        <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">返回</button><button type="button" class="nb-primary" data-action="${state.rootMode ? 'refresh-root' : 'goto-import'}">${state.rootMode ? '读取本机车辆' : '去导入 APK'}</button></div>
        <button type="button" class="nb-secondary" style="margin-top:10px" data-action="pair-list">临时密钥配对</button>
      </div></div>`;
    }
    if (state.modal === 'import-apk') {
      return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="导入九号出行 APK"><div class="nb-modal">
        <div class="nb-modal-icon">${icon('package-plus')}</div>
        <h3>导入九号出行 APK</h3>
        <p>选择你自己准备的九号出行安装包。工具本身不内置九号出行。</p>
        <div class="nb-card"><div class="nb-info-list"><div class="nb-info-row"><span>文件格式</span><strong>APK</strong></div><div class="nb-info-row"><span>导入后</span><strong>可打开登录</strong></div></div></div>
        <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">取消</button><button type="button" class="nb-primary" data-action="select-apk">选择 APK 文件</button></div>
      </div></div>`;
    }
    if (state.modal === 'login-ninebot' && !state.officialImported) {
      return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="请先导入九号出行"><div class="nb-modal">
        <div class="nb-modal-icon">${icon('package-open')}</div>
        <h3>请先导入九号出行 APK</h3>
        <p>当前工具没有内置九号出行。完成导入后，再使用账号密码登录。</p>
        <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">取消</button><button type="button" class="nb-primary" data-action="goto-import">去导入</button></div>
      </div></div>`;
    }
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="登录九号出行"><div class="nb-modal">
      <div class="nb-modal-icon">${icon('log-in')}</div>
      <h3>登录九号出行</h3>
      <p>请使用账号密码登录。登录完成后返回 BFG 电量校准，再连接车辆。</p>
      <div class="nb-card"><div class="nb-info-list"><div class="nb-info-row"><span>九号出行</span><strong>已导入</strong></div><div class="nb-info-row"><span>登录方式</span><strong>账号密码</strong></div></div></div>
      <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="close-modal">取消</button><button type="button" class="nb-primary" data-action="launch-ninebot">打开九号出行</button></div>
    </div></div>`;
  }

  function statusModal() {
    const kind = state.modal;
    const specs = {
      'bluetooth-off': ['bluetooth', '蓝牙尚未开启', state.errorMessage || '请打开系统蓝牙后返回重试。', '打开蓝牙设置', 'open-bluetooth-settings', '稍后', 'close-modal'],
      'permission-needed': ['shield-alert', '需要蓝牙相关权限', state.errorMessage || '请允许位置和附近设备权限后重试。', '我知道了', 'close-modal', '', ''],
      'auth-repair': ['key-round', '车辆认证没有回应', state.errorMessage || '检查其他应用或手机是否占用车辆蓝牙，然后重试。', state.screen === 'pair-ready' ? '重新尝试配对' : '重试连接', state.screen === 'pair-ready' ? 'begin-pair' : 'retry-connect', '稍后', 'close-modal'],
      'write-success': ['circle-check', '写入成功，二次核对完成', state.errorMessage || '已重新读取车辆参数。恢复原参数请到“设置 → 参数备份与恢复”。', '查看车辆信息', 'close-modal', '去设置恢复', 'settings'],
      'write-failure': ['circle-x', '写入未完成', state.errorMessage || '请重新读取当前参数，再决定是否重试。', '再次尝试', 'retry-write', '取消', 'close-modal'],
      'verification-incomplete': ['triangle-alert', '二次核对未完成', state.errorMessage || '先重新读取参数，确认前不要重复写入。', '重新核对', 'post-write-reread', '取消', 'close-modal'],
      'restore-unavailable': ['triangle-alert', '暂时无法恢复', state.errorMessage || '请先核对车辆与备份，再重新尝试。', '知道了', 'close-modal', '', ''],
      'scan-unavailable': ['triangle-alert', '扫描未完成', state.errorMessage || '请检查车辆连接后再试。', '我知道了', 'close-modal', '', ''],
      'read-advisory': ['triangle-alert', '读取结果仅供参考', state.errorMessage || '请核对车辆实际配置。', '我知道了', 'close-modal', '', ''],
      'unverified-dis': ['triangle-alert', '仪表配置尚未验证', state.errorMessage || '这组仪表配置尚无实车验证，请确认可以恢复原参数后继续。', '仍要尝试写入', 'confirm-unverified-dis', '取消', 'close-modal']
    };
    const item = specs[kind];
    if (!item) return '';
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="${esc(item[1])}"><div class="nb-modal">
      <div class="nb-modal-icon">${icon(item[0])}</div><h3>${esc(item[1])}</h3><p>${esc(item[2])}</p>
      ${kind === 'auth-repair' && state.screen !== 'pair-ready' ? `<button type="button" class="nb-secondary" style="margin-top:12px" data-action="start-repair">重新配对（需车端确认）</button>` : ''}
      <div class="nb-btn-row"><button type="button" class="nb-primary" data-action="${item[4]}">${item[3]}</button>${item[5] ? `<button type="button" class="nb-secondary" data-action="${item[6]}">${item[5]}</button>` : ''}</div>
    </div></div>`;
  }

  function render() {
    root.style.setProperty('--nb-radius', `${state.radius}px`);
    root.style.setProperty('--nb-accent', state.accent);
    root.dataset.dark = state.dark ? 'true' : 'false';
    maskedSn = state.vehicleSn.length > 8
      ? `${state.vehicleSn.slice(0, 4)}••••${state.vehicleSn.slice(-5)}` : state.vehicleSn;
    root.querySelector('.nb-phone').style.fontSize = state.compact ? '14px' : '16px';
    let html;
    if (state.screen === 'vehicles') html = vehiclesTemplate();
    else if (state.screen === 'settings') html = settingsTemplate();
    else if (state.screen === 'pair-list') html = vehicleListTemplate();
    else if (state.screen === 'pair-ready') html = readyTemplate(true);
    else if (state.screen === 'connect-ready') html = readyTemplate(false);
    else if (state.screen === 'pair-progress') html = progressTemplate(true);
    else if (state.screen === 'connect-progress') html = progressTemplate(false);
    else if (state.screen === 'write-progress') html = writeProgressTemplate();
    else if (state.screen === 'post-write-check') html = postWriteCheckTemplate();
    else if (state.screen === 'scan-progress' || state.screen === 'scan-result') html = scanTemplate();
    else if (state.screen === 'review') html = reviewTemplate();
    else if (state.screen === 'write') html = writeTemplate();
    else html = homeTemplate();
    screen.innerHTML = `<div class="nb-page-wrap">${html}${state.modal === 'wake' ? wakeModal() : state.modal === 'write-confirm' ? writeConfirmModal() : state.modal === 'dashboard-requirements' ? dashboardRequirementsModal() : state.modal === 'import-apk' || state.modal === 'login-ninebot' || state.modal === 'missing-vehicle' ? officialAppModal() : statusModal()}</div>`;
    const modalVisibility = state.modal ? 'open' : 'closed';
    if (modalVisibility !== lastModalVisibility) {
      lastModalVisibility = modalVisibility;
      nativeAction('modal-state', modalVisibility);
    }
    root.querySelectorAll('[data-preview]').forEach(btn => btn.classList.toggle('is-active', btn.dataset.preview === (state.result || state.screen)));
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }

  function go(screenName) { state.screen = screenName; state.modal = null; render(); save(); nativeAction('screen', screenName); }
  function showWake(path) { state.path = path; state.modal = 'wake'; render(); save(); }
  function completeConnection(pairing) {
    state.result = null;
    state.errorMessage = '';
    state.busyMessage = '';
    go(pairing ? 'pair-progress' : 'connect-progress');
    if (window.BfgNative) nativeAction(pairing ? 'begin-pair' : 'begin-connect', pairing ? String(state.selectedPairIndex ?? '') : '');
    else window.setTimeout(() => { if (state.screen.endsWith('progress')) go('review'); }, 900);
  }
  function completeWrite(result) {
    state.result = result;
    go('review');
  }

  root.addEventListener('click', event => {
    const preview = event.target.closest('[data-preview]');
    if (preview) {
      const p = preview.dataset.preview;
      if (p === 'success' || p === 'failure') { state.result = p; go('review'); }
      else { state.result = null; go(p); }
      return;
    }
    const type = event.target.closest('[data-type]');
    if (type) { state.writeType = type.dataset.type; render(); save(); return; }
    const voltage = event.target.closest('[data-voltage]');
    if (voltage) {
      state.voltage = Number(voltage.dataset.voltage);
      const options = state.capacityByVoltage[String(state.voltage)] || state.availableCapacities;
      if (Array.isArray(options) && options.length) {
        state.availableCapacities = options;
        if (!options.includes(state.capacity)) state.capacity = options.find(v => v >= state.capacity) || options[options.length - 1];
      }
      render(); save(); return;
    }
    const cap = event.target.closest('[data-capacity]');
    if (cap) { state.capacity = Number(cap.dataset.capacity); render(); save(); return; }
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    if (action === 'home') { if (window.BfgNative) nativeAction('cancel'); if (window.BfgNative && state.screen === 'write-progress') return; state.result = null; go('home'); }
    else if (action === 'back') { if (state.screen === 'post-write-check') return; if (window.BfgNative && state.screen.endsWith('progress')) nativeAction('cancel'); if (window.BfgNative && state.screen === 'write-progress') return; go(state.screen === 'scan-result' || state.screen === 'scan-progress' ? 'settings' : state.screen === 'write' ? 'review' : 'home'); }
    else if (action === 'vehicles' || action === 'settings') { go(action); }
    else if (action === 'select-vehicle') { state.selectedVehicleIndex = Number(actionEl.dataset.index); if (window.BfgNative) nativeAction('select-vehicle', String(state.selectedVehicleIndex)); go('home'); }
    else if (action === 'refresh-vehicles') { if (window.BfgNative) nativeAction('refresh-vehicles'); }
    else if (action === 'set-root') { state.rootMode = actionEl.dataset.value === 'true'; render(); if (window.BfgNative) nativeAction('set-root', String(state.rootMode)); }
    else if (action === 'toggle-fallback') { state.rootFallback = !state.rootFallback; render(); if (window.BfgNative) nativeAction('set-fallback', String(state.rootFallback)); }
    else if (action === 'import-root') { if (window.BfgNative) nativeAction('import-root'); }
    else if (action === 'export-diag' || action === 'show-license' || action === 'clear-data'
             || action === 'restore-first' || action === 'restore-prewrite') { if (window.BfgNative) nativeAction(action); }
    else if (action === 'scan-dis' || action === 'scan-bfg') { state.scanModule = action === 'scan-dis' ? '仪表盘' : '计量模块'; state.errorMessage = ''; state.scanReplies = 0; state.scanTimeouts = 0; go('scan-progress'); if (window.BfgNative) nativeAction(action); }
    else if (action === 'cancel-scan') { if (window.BfgNative) nativeAction('cancel'); go('settings'); }
    else if (action === 'open-import') { state.modal = 'import-apk'; render(); save(); }
    else if (action === 'open-login') { state.modal = 'login-ninebot'; render(); save(); }
    else if (action === 'show-dashboard-requirements') { state.modal = 'dashboard-requirements'; render(); }
    else if (action === 'goto-import') { state.modal = 'import-apk'; render(); save(); }
    else if (action === 'select-apk') { if (window.BfgNative) nativeAction('select-apk'); else state.officialImported = true; state.modal = null; render(); save(); }
    else if (action === 'launch-ninebot') { state.modal = null; render(); save(); if (window.BfgNative) nativeAction('launch-ninebot'); }
    else if (action === 'refresh-root') { state.modal = null; render(); if (window.BfgNative) nativeAction('refresh-root'); }
    else if (action === 'pair-list') { go('pair-list'); if (window.BfgNative) nativeAction('pair-scan'); }
    else if (action === 'pair-select') { const index = Number(actionEl.dataset.index); state.selectedPairIndex = index; const vehicle = state.vehicles[index]; if (vehicle) state.vehicleSn = vehicle.sn; if (window.BfgNative) nativeAction('pair-select', String(index)); showWake('pair'); }
    else if (action === 'connect-start') { if (window.BfgNative && !state.vehicleSn) { state.modal = 'missing-vehicle'; render(); } else showWake('connect'); }
    else if (action === 'wake-confirm') go(state.path === 'pair' ? 'pair-ready' : 'connect-ready');
    else if (action === 'close-modal') { state.modal = null; render(); save(); }
    else if (action === 'open-bluetooth-settings') { state.modal = null; render(); if (window.BfgNative) nativeAction('open-bluetooth-settings'); }
    else if (action === 'retry-connect') { state.modal = null; completeConnection(false); }
    else if (action === 'start-repair') { state.modal = null; render(); if (window.BfgNative) nativeAction('start-repair'); else go('pair-list'); }
    else if (action === 'retry-write') {
      const target = JSON.stringify({type:state.writeType,voltage:state.voltage,capacity:state.capacity});
      state.modal = null; state.result = null; state.writeStage = 'precheck'; go('connect-progress');
      if (window.BfgNative) nativeAction('retry-write', target);
      else window.setTimeout(() => { go('write'); state.modal = 'write-confirm'; render(); }, 500);
    }
    else if (action === 'post-write-reread') { state.modal = null; go('post-write-check'); if (window.BfgNative) nativeAction('post-write-reread'); }
    else if (action === 'confirm-unverified-dis') { state.modal = null; state.writeStage = 'precheck'; go('write-progress'); if (window.BfgNative) nativeAction('confirm-unverified-dis'); }
    else if (action === 'begin-pair') completeConnection(true);
    else if (action === 'begin-connect') completeConnection(false);
    else if (action === 'write') go('write');
    else if (action === 'refresh-review') { state.result = null; go('connect-progress'); if (window.BfgNative) nativeAction('refresh-read'); }
    else if (action === 'confirm-write') {
      if (state.writeType === 'dashboard' && !state.dashboardWriteSupported) return;
      if (state.writeType === 'meter' && !state.writeSupported) return;
      state.modal = 'write-confirm'; render(); save();
    }
    else if (action === 'do-write') {
      state.modal = null;
      state.result = null;
      state.errorMessage = '';
      state.writeStage = 'precheck';
      go('write-progress');
      if (window.BfgNative) nativeAction('do-write', JSON.stringify({type:state.writeType,voltage:state.voltage,capacity:state.capacity}));
      else window.setTimeout(() => completeWrite('success'), 900);
    }
  });

  window.bfgNativeUpdate = function(json) {
    const update = typeof json === 'string' ? JSON.parse(json) : json;
    Object.assign(state, update);
    if (update.screen) { state.screen = update.screen; nativeAction('screen', update.screen); }
    if (update.result && !Object.prototype.hasOwnProperty.call(update, 'modal')) state.modal = null;
    render();
  };
  window.bfgNativeGo = function(screenName) { go(screenName); };

  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector('.nb-phone'), onChange: render });
    tweak.addSlider(state, 'radius', { label: '卡片圆角', min: 14, max: 30, unit: 'px', reference: '--nb-radius' });
    tweak.addColorPicker(state, 'accent', { label: '主色', reference: '--nb-accent' });
    tweak.addToggle(state, 'compact', { label: '紧凑排版', reference: 'layout.compact' });
  }
})();
</script>
</body></html>
