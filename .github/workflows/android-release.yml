name: Android Release

# 手动触发，不随 push 自动构建。
# 只构建 release 变体，构建完成后把 APK 挂到 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v5.0.35. Leave empty to use versionName from build.gradle'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "29.0.13846066"

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ${{ runner.tool_cache }}/android-ndk
          key: android-sdk-${{ runner.os }}-c${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${RUNNER_TOOL_CACHE}/android-sdk"
          NDK_ROOT="${RUNNER_TOOL_CACHE}/android-ndk"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::group::Download commandline-tools"
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "::endgroup::"
          fi

          echo "::group::Accept licenses"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          echo "::endgroup::"

          echo "::group::Install platforms / build-tools / platform-tools"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "::endgroup::"

          echo "::group::Install NDK ${ANDROID_NDK_VERSION}"
          if [ ! -d "$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;${ANDROID_NDK_VERSION}"
          else
            echo "NDK already present in SDK"
          fi
          echo "::endgroup::"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          mkdir -p "$NDK_ROOT"
          ln -sfn "$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" "$NDK_ROOT/${ANDROID_NDK_VERSION}" || true

      - name: Restore release signing config
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_BASE64:-}" ] || missing+=("RELEASE_KEYSTORE_BASE64")
          [ -n "${STORE_PASSWORD:-}" ]  || missing+=("RELEASE_STORE_PASSWORD")
          [ -n "${KEY_ALIAS:-}" ]       || missing+=("RELEASE_KEY_ALIAS")
          [ -n "${KEY_PASSWORD:-}" ]    || missing+=("RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          umask 077
          cat > release-signing.properties <<EOF
          storeFile=signing/release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "Release signing config restored."

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --warning-mode summary

      - name: Resolve version and collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName = ['\"]\(.*\)['\"].*/\1/p" build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/.*versionCode = \([0-9]*\).*/\1/p" build.gradle | head -1)
          [ -n "$VERSION_NAME" ] || { echo "::error::Cannot read versionName from build.gradle"; exit 1; }

          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="v${VERSION_NAME}"

          mkdir -p dist
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} dist/ \;
          COUNT=$(find dist -maxdepth 1 -name '*.apk' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "::error::No release APK produced"; exit 1; }

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Collected $COUNT APK(s) for tag $TAG (versionName=$VERSION_NAME)"
          ls -lh dist

      - name: Verify signing of release APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -5
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: BFG电量校准 ${{ steps.collect.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            BFG 电量校准 ${{ steps.collect.outputs.version_name }}（versionCode ${{ steps.collect.outputs.version_code }}）

            - commit: `${{ github.sha }}`
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 签名: release keystore（CI secrets 注入）

            安装包：
            - `BFGCalibration_${{ steps.collect.outputs.version_name }}_universal.apk` — 通用包，推荐
            - `BFGCalibration_${{ steps.collect.outputs.version_name }}_arm64-v8a.apk` — 64 位 ARM
            - `BFGCalibration_${{ steps.collect.outputs.version_name }}_armeabi-v7a.apk` — 32 位 ARM

            最低 Android 12（API 31）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
