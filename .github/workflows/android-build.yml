name: Android Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK (requires signing secrets)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "29.0.13846066"

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Android SDK and NDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ${{ runner.tool_cache }}/android-ndk
          key: android-sdk-${{ runner.os }}-c${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${RUNNER_TOOL_CACHE}/android-sdk"
          NDK_ROOT="${RUNNER_TOOL_CACHE}/android-ndk"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::group::Download commandline-tools"
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "::endgroup::"
          fi

          echo "::group::Accept licenses"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          echo "::endgroup::"

          echo "::group::Install platforms / build-tools / platform-tools"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "::endgroup::"

          echo "::group::Install NDK ${ANDROID_NDK_VERSION}"
          if [ ! -d "$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;${ANDROID_NDK_VERSION}"
          else
            echo "NDK already present in SDK"
          fi
          echo "::endgroup::"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          # Persist the NDK symlink layout used by cached runs.
          mkdir -p "$NDK_ROOT"
          ln -sfn "$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" "$NDK_ROOT/${ANDROID_NDK_VERSION}" || true

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          ls -1 "$ANDROID_HOME/ndk"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare optional release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/BFGCalibration-release.jks
          cat > release-signing.properties <<EOF
          storeFile=signing/BFGCalibration-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build debug APKs
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_release) }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --warning-mode summary

      - name: Build release APKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace --warning-mode summary

      - name: Collect APKs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          find app/build/outputs -type f -name '*.apk' -print -exec cp {} ci-artifacts/ \; 2>/dev/null || true
          ls -la ci-artifacts || true

      - name: Upload APK artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: BFGCalibration-apk-${{ github.sha }}
          path: ci-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
